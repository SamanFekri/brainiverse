<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Brainiverse — the right minds for every mission</title>
  <desc id="desc">A leader star lights up, ten agent stars join it in the shape of a brain, and example missions cycle: plan a trip, build an app, test a startup idea.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#312e81"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leader" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <clipPath id="card"><rect width="880" height="300" rx="28"/></clipPath>
  </defs>

  <style>
    /* One 9-second loop. Every element uses the same duration; delays stagger it. */
    .fade   { animation: fade 9s infinite both; }
    .pop    { animation: pop 9s infinite both; transform-box: fill-box; transform-origin: center; }
    .draw   { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s infinite both; }
    .pulse  { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle{ animation: twinkle 3s ease-in-out infinite; }
    .mission{ animation: mission 9s infinite both; opacity: 0; }
    @keyframes fade    { 0% { opacity: 0 } 6%, 94% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes pop     { 0% { opacity: 0; transform: scale(0.2) } 4% { opacity: 1; transform: scale(1.25) } 7%, 94% { opacity: 1; transform: scale(1) } 100% { opacity: 0; transform: scale(1) } }
    @keyframes draw    { 0% { stroke-dashoffset: 1 } 6%, 94% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 1 } }
    @keyframes pulse   { 0%, 100% { transform: scale(1); opacity: 0.85 } 50% { transform: scale(1.18); opacity: 1 } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25 } 50% { opacity: 0.9 } }
    @keyframes mission { 0% { opacity: 0; transform: translateY(8px) } 4%, 29% { opacity: 1; transform: translateY(0) } 33%, 100% { opacity: 0; transform: translateY(-8px) } }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      .fade, .pop, .draw, .pulse, .twinkle { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .mission { animation: none; }
      .m1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#space)"/>

    <!-- stars -->
    <g fill="#e0e7ff">
      <circle class="twinkle" cx="40" cy="36" r="1.6"/>
      <circle class="twinkle" cx="300" cy="30" r="1.3" style="animation-delay:-1s"/>
      <circle class="twinkle" cx="840" cy="40" r="1.6" style="animation-delay:-2s"/>
      <circle class="twinkle" cx="852" cy="284" r="1.4" style="animation-delay:-0.5s"/>
      <circle class="twinkle" cx="520" cy="276" r="1.2" style="animation-delay:-1.5s"/>
      <circle class="twinkle" cx="28" cy="250" r="1.3" style="animation-delay:-2.5s"/>
      <circle class="twinkle" cx="660" cy="22" r="1.1" style="animation-delay:-0.8s"/>
    </g>

    <!-- the squad: brain constellation (same geometry as the icon), centred at (150,150) -->
    <g transform="translate(22 44)">
      <ellipse class="fade" cx="128" cy="128" rx="116" ry="38" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-opacity="0.35" transform="rotate(-18 128 128)"/>

      <g fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7">
        <path class="draw" pathLength="1" style="animation-delay:0.2s" d="M128 58 Q112 34 96 48 Q66 42 60 70 Q36 82 48 108 Q32 132 62 146 Q66 174 100 166 Q118 180 128 162"/>
        <path class="draw" pathLength="1" style="animation-delay:0.2s" d="M128 58 Q144 34 160 48 Q190 42 196 70 Q220 82 208 108 Q224 132 194 146 Q190 174 156 166 Q138 180 128 162"/>
        <path class="fade" d="M120 166 Q126 188 116 204" stroke-opacity="0.5" style="animation-delay:0.4s"/>
      </g>

      <g stroke="#fde68a" stroke-width="2.5" stroke-opacity="0.75" stroke-linecap="round">
        <line class="draw" pathLength="1" style="animation-delay:0.9s" x1="128" y1="108" x2="96" y2="48"/>
        <line class="draw" pathLength="1" style="animation-delay:1.05s" x1="128" y1="108" x2="160" y2="48"/>
        <line class="draw" pathLength="1" style="animation-delay:1.2s" x1="128" y1="108" x2="60" y2="70"/>
        <line class="draw" pathLength="1" style="animation-delay:1.35s" x1="128" y1="108" x2="196" y2="70"/>
        <line class="draw" pathLength="1" style="animation-delay:1.5s" x1="128" y1="108" x2="48" y2="108"/>
        <line class="draw" pathLength="1" style="animation-delay:1.65s" x1="128" y1="108" x2="208" y2="108"/>
        <line class="draw" pathLength="1" style="animation-delay:1.8s" x1="128" y1="108" x2="62" y2="146"/>
        <line class="draw" pathLength="1" style="animation-delay:1.95s" x1="128" y1="108" x2="194" y2="146"/>
        <line class="draw" pathLength="1" style="animation-delay:2.1s" x1="128" y1="108" x2="100" y2="166"/>
        <line class="draw" pathLength="1" style="animation-delay:2.25s" x1="128" y1="108" x2="156" y2="166"/>
      </g>

      <g stroke="#1e1b4b" stroke-width="2.5">
        <circle class="pop" style="animation-delay:1.1s" cx="96" cy="48" r="9" fill="#f472b6"/>
        <circle class="pop" style="animation-delay:1.25s" cx="160" cy="48" r="8" fill="#22d3ee"/>
        <circle class="pop" style="animation-delay:1.4s" cx="60" cy="70" r="8" fill="#22d3ee"/>
        <circle class="pop" style="animation-delay:1.55s" cx="196" cy="70" r="9" fill="#f472b6"/>
        <circle class="pop" style="animation-delay:1.7s" cx="48" cy="108" r="9" fill="#a78bfa"/>
        <circle class="pop" style="animation-delay:1.85s" cx="208" cy="108" r="8" fill="#34d399"/>
        <circle class="pop" style="animation-delay:2s" cx="62" cy="146" r="8" fill="#34d399"/>
        <circle class="pop" style="animation-delay:2.15s" cx="194" cy="146" r="9" fill="#a78bfa"/>
        <circle class="pop" style="animation-delay:2.3s" cx="100" cy="166" r="9" fill="#60a5fa"/>
        <circle class="pop" style="animation-delay:2.45s" cx="156" cy="166" r="8" fill="#60a5fa"/>
      </g>

      <circle class="pulse" cx="128" cy="108" r="38" fill="url(#glow)"/>
      <g class="pop" style="animation-delay:0.5s">
        <circle cx="128" cy="108" r="15" fill="url(#leader)" stroke="#fffbeb" stroke-width="2"/>
        <path d="M128 96 l3.2 7.8 8.3 0.6 -6.4 5.3 2 8.1 -7.1 -4.4 -7.1 4.4 2 -8.1 -6.4 -5.3 8.3 -0.6z" fill="#b45309" opacity="0.85"/>
      </g>
    </g>

    <!-- words -->
    <g class="fade" style="animation-delay:0.3s">
      <text x="330" y="112" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">Brainiverse</text>
      <text x="332" y="146" font-size="21" fill="#c7d2fe">The right minds for every mission.</text>
    </g>

    <g class="fade" style="animation-delay:0.8s">
      <text x="332" y="196" font-size="13" font-weight="700" fill="#fcd34d" letter-spacing="2.5">YOUR MISSION</text>
    </g>
    <g font-size="22" font-weight="600" fill="#ffffff">
      <text class="mission m1" x="332" y="228" style="animation-delay:1s">✈️  Plan two weeks in Japan</text>
      <text class="mission" x="332" y="228" style="animation-delay:4s">🛠️  Build and ship a web app</text>
      <text class="mission" x="332" y="228" style="animation-delay:7s">🔍  Is my startup idea worth it?</text>
    </g>
    <g class="fade" style="animation-delay:2.6s">
      <text x="332" y="262" font-size="15" fill="#a5b4fc">→ a squad of real agents assembles, works in parallel, and reports back</text>
    </g>
  </g>
</svg>
