<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Brainiverse</title>
  <desc id="desc">A constellation shaped like a brain: a bright leader star at the centre, linked to a ring of agent stars, inside an orbit.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leader" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <clipPath id="badge">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="256" height="256" fill="url(#space)"/>

    <!-- background stars -->
    <g fill="#e0e7ff">
      <circle cx="30" cy="40" r="1.6" opacity="0.7"/>
      <circle cx="214" cy="30" r="1.3" opacity="0.6"/>
      <circle cx="226" cy="206" r="1.8" opacity="0.6"/>
      <circle cx="44" cy="214" r="1.2" opacity="0.5"/>
      <circle cx="128" cy="22" r="1.1" opacity="0.5"/>
      <circle cx="18" cy="128" r="1.1" opacity="0.5"/>
      <circle cx="240" cy="120" r="1.2" opacity="0.5"/>
      <circle cx="176" cy="236" r="1.1" opacity="0.4"/>
    </g>

    <!-- orbit -->
    <ellipse cx="128" cy="128" rx="116" ry="38" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-opacity="0.35" transform="rotate(-18 128 128)"/>
    <circle cx="236" cy="96" r="5" fill="#a5b4fc" opacity="0.9"/>

    <!-- brain silhouette: two lobes traced through the agent stars -->
    <g fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7">
      <path d="M128 58 Q112 34 96 48 Q66 42 60 70 Q36 82 48 108 Q32 132 62 146 Q66 174 100 166 Q118 180 128 162"/>
      <path d="M128 58 Q144 34 160 48 Q190 42 196 70 Q220 82 208 108 Q224 132 194 146 Q190 174 156 166 Q138 180 128 162"/>
      <path d="M128 58 L128 162" stroke-dasharray="5 9" stroke-opacity="0.5"/>
      <path d="M120 166 Q126 188 116 204" stroke-opacity="0.5"/>
    </g>

    <!-- links from the leader to every agent -->
    <g stroke="#fde68a" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round">
      <line x1="128" y1="108" x2="96" y2="48"/>
      <line x1="128" y1="108" x2="60" y2="70"/>
      <line x1="128" y1="108" x2="48" y2="108"/>
      <line x1="128" y1="108" x2="62" y2="146"/>
      <line x1="128" y1="108" x2="100" y2="166"/>
      <line x1="128" y1="108" x2="160" y2="48"/>
      <line x1="128" y1="108" x2="196" y2="70"/>
      <line x1="128" y1="108" x2="208" y2="108"/>
      <line x1="128" y1="108" x2="194" y2="146"/>
      <line x1="128" y1="108" x2="156" y2="166"/>
    </g>

    <!-- agents -->
    <g stroke="#1e1b4b" stroke-width="2.5">
      <circle cx="96" cy="48" r="9" fill="#f472b6"/>
      <circle cx="60" cy="70" r="8" fill="#22d3ee"/>
      <circle cx="48" cy="108" r="9" fill="#a78bfa"/>
      <circle cx="62" cy="146" r="8" fill="#34d399"/>
      <circle cx="100" cy="166" r="9" fill="#60a5fa"/>
      <circle cx="160" cy="48" r="8" fill="#22d3ee"/>
      <circle cx="196" cy="70" r="9" fill="#f472b6"/>
      <circle cx="208" cy="108" r="8" fill="#34d399"/>
      <circle cx="194" cy="146" r="9" fill="#a78bfa"/>
      <circle cx="156" cy="166" r="8" fill="#60a5fa"/>
    </g>

    <!-- the leader -->
    <circle cx="128" cy="108" r="38" fill="url(#glow)"/>
    <circle cx="128" cy="108" r="15" fill="url(#leader)" stroke="#fffbeb" stroke-width="2"/>
    <path d="M128 96 l3.2 7.8 8.3 0.6 -6.4 5.3 2 8.1 -7.1 -4.4 -7.1 4.4 2 -8.1 -6.4 -5.3 8.3 -0.6z" fill="#b45309" opacity="0.85"/>
  </g>
</svg>
